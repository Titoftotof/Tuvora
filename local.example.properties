# --- PostHog (crash reporting + release health) ---
# Configure the uploader through ENVIRONMENT VARIABLES, not entries in this file.
# The CLI child process inherits the environment; Gradle does not forward local.properties.
# PowerShell example (replace the placeholder locally, never commit a personal API key):
#     $env:POSTHOG_CLI_API_KEY = '<personal-api-key>'
#     $env:POSTHOG_CLI_HOST = 'https://us.posthog.com'
#     $env:POSTHOG_CLI_PROJECT_ID = '494529'
# Requires posthog-cli on PATH (CI installs a pinned version).
# Without POSTHOG_CLI_API_KEY in the environment, mapping upload is skipped.
# Local assemble/bundle remains available without the uploader.

# --- DV7 / libdovi (Dolby Vision Profile 7 to 8.1) ---

# Build the dovi_bridge native lib + load the runtime bridge.
DOVI_NATIVE_ENABLED=true

# Marks extractor hook integration as available in the current build.
DOVI_EXTRACTOR_HOOK_READY=true

# Link the prebuilt libdovi static archive into dovi_bridge.
DOVI_ENABLE_REAL_LINK=true
# Optional explicit overrides (otherwise resolved from the prebuilt root below):
# DOVI_LIBDOVI_STATIC_LIB=/path/to/libdovi.a
# DOVI_LIBDOVI_INCLUDE_DIR=/path/to/libdovi/include
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi
