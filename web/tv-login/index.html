<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://athgklmjipltuskdfvov.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Connecter ma TV — Tuvora</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
<main>
  <p class="brand">TUVORA</p>
  <h1>Connecter ma TV</h1>
  <p>Connectez-vous sur ce téléphone, puis autorisez la TV que vous venez de scanner.</p>
  <p id="status" role="status" aria-live="polite">Préparation…</p>
  <noscript>Activez JavaScript pour utiliser cette page.</noscript>
  <form id="login" method="post" hidden>
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
    <div id="eligibility" hidden>
      <label class="check"><input id="adult" type="checkbox"> J’ai au moins 18 ans.</label>
      <label class="check"><input id="terms" type="checkbox"> J’accepte les <a href="https://tuvora.co/terms" target="_blank" rel="noopener noreferrer">conditions d’utilisation</a>.</label>
    </div>
    <button id="submit" type="submit" disabled>Se connecter</button>
    <button id="mode" type="button" class="secondary" disabled>Créer un compte</button>
  </form>
  <section id="confirmation" hidden>
    <p id="account"></p>
    <p>Vérifiez que cette TV est bien la vôtre :</p>
    <p id="device" class="device"></p>
    <p>Ne confirmez pas une demande envoyée par une autre personne.</p>
    <button id="approve" type="button" disabled>Connecter cette TV</button>
    <button id="cancel" type="button" class="secondary">Annuler</button>
  </section>
  <p class="footnote">Aucun mot de passe n’est saisi sur la TV.</p>
</main>
</body>
</html>
