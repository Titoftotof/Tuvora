name: Release

# Production release. Triggered by pushing a tag like v1.2.3 (or run manually with a version).
# Builds the SIGNED release APK + AAB and publishes them to a GitHub Release.
#
# Required repo secrets (set once — see the release notes):
#   RELEASE_KEYSTORE_BASE64   base64 of your release keystore (.jks)
#   RELEASE_STORE_PASSWORD    keystore password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password
#   SUPABASE_URL / SUPABASE_ANON_KEY   (optional) bake login into the release
#   POSTHOG_CLI_API_KEY  personal key with Error Tracking write + organization read
#
# Play Store upload AAB (playstore flavor) signs with a SEPARATE dedicated key —
# the GitHub-release key must never change (the in-app updater needs signature
# continuity), while the Play upload key is rotatable via Play App Signing:
#   PLAY_UPLOAD_KEYSTORE_BASE64 / PLAY_UPLOAD_STORE_PASSWORD
#   PLAY_UPLOAD_KEY_ALIAS / PLAY_UPLOAD_KEY_PASSWORD
#
# The playstore AAB is then published to Google Play automatically via the Play
# Developer API (service account json in PLAY_SERVICE_ACCOUNT_JSON). A tag push
# publishes to the single production track.
# Production access is already enabled for these apps.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3 (creates tag v<version>)'
        required: true
      play_track:
        description: 'Google Play track to publish the AAB to'
        required: true
        default: production
        type: choice
        options: [production]
      announce:
        description: Send community announcements
        type: boolean
        default: false
      play_manual_review:
        description: Save Play changes for review in Play Console when automatic submission is unavailable
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      POSTHOG_CLI_HOST: https://us.posthog.com
      POSTHOG_CLI_PROJECT_ID: '494529'
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle (deps + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-deprecated 'tools' package, which cmdline-tools 16.0
          # (runner image, 2026-09) no longer ships -> sdkmanager exits 1. The next step installs the rest.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install PostHog symbol uploader
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          if [ -n "$POSTHOG_CLI_API_KEY" ]; then
            npm install --global @posthog/cli@0.10.0
          else
            echo "POSTHOG_CLI_API_KEY is not set, skipping PostHog CLI install."
          fi

      - name: Setup signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          else
            echo "Generating fallback signing keystore..."
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.jks" -alias nuviotv \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 815787 -keypass 815787 \
              -dname "CN=Tuvora TV, OU=TV, O=Tuvora, L=Paris, S=IDF, C=FR"
          fi

      - name: Configure local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          {
            echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD:-815787}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS:-nuviotv}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-815787}"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "TMDB_API_KEY=$TMDB_API_KEY"
            echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET"
            echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID"
            echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET"
            echo "DONATIONS_DONATE_URL=$DONATIONS_DONATE_URL"
          } >> local.properties

      - name: Verify local.properties keys reached the build
        run: |
          echo "keys in local.properties:"
          sed -n 's/^\([A-Za-z0-9_]*\)=.*/  \1/p' local.properties | sort

      - name: Raise Gradle heap
        run: printf '\norg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\n' >> gradle.properties

      - name: Build signed release APK + AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          export NUVIO_RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.jks"
          export NUVIO_RELEASE_STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-815787}"
          export NUVIO_RELEASE_KEY_ALIAS="${RELEASE_KEY_ALIAS:-nuviotv}"
          export NUVIO_RELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-815787}"
          ./gradlew :app:assembleFullRelease \
            -PversionNameOverride="${{ steps.ver.outputs.version }}" \
            -PversionCodeOverride="${{ github.run_number }}" --stacktrace
          ./gradlew :app:bundleFullRelease \
            -PversionNameOverride="${{ steps.ver.outputs.version }}" \
            -PversionCodeOverride="${{ github.run_number }}" --stacktrace

      - name: Decode Play upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        if: env.PLAY_UPLOAD_KEYSTORE_BASE64 != ''
        run: echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/play-upload.jks"

      - name: Build Play Store AAB (playstore flavor, dedicated upload key)
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        if: env.PLAY_UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          export NUVIO_RELEASE_STORE_FILE="$GITHUB_WORKSPACE/play-upload.jks"
          export NUVIO_RELEASE_STORE_PASSWORD="${PLAY_UPLOAD_STORE_PASSWORD:-815787}"
          export NUVIO_RELEASE_KEY_ALIAS="${PLAY_UPLOAD_KEY_ALIAS:-nuviotv}"
          export NUVIO_RELEASE_KEY_PASSWORD="${PLAY_UPLOAD_KEY_PASSWORD:-815787}"
          ./gradlew :app:bundlePlaystoreRelease \
            -PversionNameOverride="${{ steps.ver.outputs.version }}" \
            -PversionCodeOverride="${{ github.run_number }}" --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "app/build/outputs/apk/full/release/app-full-universal-release.apk" \
            "dist/Tuvora-TV-${{ steps.ver.outputs.version }}.apk"
          cp "app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk" \
            "dist/Tuvora-TV-${{ steps.ver.outputs.version }}-arm64-v8a.apk"
          cp "app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk" \
            "dist/Tuvora-TV-${{ steps.ver.outputs.version }}-armeabi-v7a.apk"
          cp "$(find app/build/outputs/bundle/fullRelease -name '*.aab' | head -1)" "dist/Tuvora-TV-${{ steps.ver.outputs.version }}.aab"
          PLAYSTORE_AAB=$(find app/build/outputs/bundle/playstoreRelease -name '*.aab' 2>/dev/null | head -1 || true)
          if [ -n "$PLAYSTORE_AAB" ]; then
            cp "$PLAYSTORE_AAB" "dist/Tuvora-TV-${{ steps.ver.outputs.version }}-playstore.aab"
          fi
          ls -la dist

      - name: Publish GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/* \
            --title "Tuvora TV ${{ steps.ver.outputs.version }}" \
            --generate-notes || \
          gh release upload "${{ steps.ver.outputs.tag }}" dist/* --clobber

      # Play publishing runs only if credentials are set
      - name: Publish AAB to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tuvora.tv
          releaseFiles: app/build/outputs/bundle/playstoreRelease/*.aab
          tracks: ${{ github.event.inputs.play_track || 'production' }}
          status: completed
          changesNotSentForReview: ${{ inputs.play_manual_review || false }}

      # The download links people actually use — tuvora.co/tv, and the aftv.news Downloader code
      # pointing at it — are not a lookup. The site serves whatever a release last told it, so tell
      # it now. This is the step that makes a released build reachable; if it fails the release is
      # published but the short URL still serves the previous build, so it fails the job loudly.
      - name: Publish the download pointer to tuvora.co
        if: ${{ !cancelled() && steps.github_release.outcome == 'success' }}
        env:
          RELEASE_TOKEN: ${{ secrets.TUVORA_RELEASE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::TUVORA_RELEASE_TOKEN is not set — tuvora.co/tv will keep serving the previous build"
            exit 0
          fi
          ASSET="Tuvora-TV-${VERSION}.apk"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          curl -fsS -X POST "https://tuvora.co/api/releases" \
            -H "authorization: Bearer $RELEASE_TOKEN" \
            -H "content-type: application/json" \
            -d "$(jq -n --arg p "tv" --arg t "$TAG" --arg u "$URL" --arg n "$ASSET" \
                  '{platform:$p, tag:$t, asset_url:$u, asset_name:$n}')"
          echo

          # One request, no retry loop: the pointer is stored, not cached, so it is either right now
          # or something is wrong.
          TARGET=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "https://tuvora.co/tv")
          echo "https://tuvora.co/tv -> $TARGET"
          case "$TARGET" in
            *"/download/${TAG}/"*) echo "✅ tuvora.co/tv serves ${TAG}" ;;
            *) echo "::error::tuvora.co/tv serves '$TARGET', not ${TAG}"; exit 1 ;;
          esac

      # Community announcements — no-ops until the DISCORD_/TELEGRAM_ secrets exist.
      # Never fails the release (all curl errors are swallowed).
      - name: Announce release (Discord + Telegram)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.announce }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          MSG=$(printf '%s\n' \
            "Tuvora TV ${VERSION} is out! 🎉" \
            "" \
            "⬇️ APK: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" \
            "🏪 Play beta: join https://groups.google.com/g/tuvora-testers then https://play.google.com/apps/testing/com.tuvora.tv" \
            "📖 Guides: https://tuvora.co/guides")
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            jq -n --arg c "$MSG" '{content: $c}' | \
              curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" \
              || echo "::warning::Discord announce failed"
          else
            echo "DISCORD_WEBHOOK_URL not set - skipping Discord announce"
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode text="$MSG" >/dev/null \
              || echo "::warning::Telegram announce failed"
          else
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set - skipping Telegram announce"
          fi
